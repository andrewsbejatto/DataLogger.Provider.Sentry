# /etc/nginx/sites-available/glitchtip.conf
#
# TLS via certbot:
#   certbot --nginx -d erros.suaempresa.com.br
#
# Ponto de atenção: o endpoint de ingestão (/api/<id>/envelope/) é o que
# os 50 serviços vão chamar. Ele precisa aceitar POST com corpo razoável
# e não pode ficar atrás de autenticação do nginx.

upstream glitchtip {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name erros.suaempresa.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name erros.suaempresa.com.br;

    # ssl_certificate / ssl_certificate_key preenchidos pelo certbot

    client_max_body_size 40M;      # eventos com stack grande + anexos
    keepalive_timeout 75s;

    # Compressão do payload de ingestão vem do cliente; não recomprima.
    gzip off;

    location / {
        proxy_pass         http://glitchtip;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
    }
}
